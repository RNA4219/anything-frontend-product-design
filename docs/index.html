<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f8f7f2">
<title>かさね印刷室 — 二色刷りの見本帳</title>
<style>
:root{color-scheme:light;--paper:#f8f7f2;--ink:#242822;--muted:#545950;--rule:#c9cbc0;--accent:#a33c20;--sans:"Yu Gothic UI","Hiragino Kaku Gothic ProN",Meiryo,Arial,sans-serif;--serif:"Yu Mincho","Hiragino Mincho ProN","Noto Serif CJK JP",serif;--latin:"Baskervville",Georgia,"Times New Roman",serif;--mono:Consolas,"Courier New",monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--sans)}
button,input,a{font:inherit}button{cursor:pointer}button,a,input{touch-action:manipulation}
button{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #12616c;outline-offset:4px}
.shell{width:min(100% - 96px,1280px);margin-inline:auto}
header{border-bottom:1px solid var(--rule)}
.mast{height:66px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;line-height:1}
.brand-mark{display:inline-block;position:relative;width:34px;height:31px}
.brand-mark::before,.brand-mark::after{content:"";position:absolute;width:21px;height:28px;top:1px;border-radius:50%;transform:rotate(31deg);background:#df5935;mix-blend-mode:multiply}
.brand-mark::after{left:11px;background:#344f68}
.wordmark{font:600 32px/.95 var(--latin);letter-spacing:-1.7px}
.brand-ja{border-left:1px solid var(--rule);padding-left:12px;color:var(--muted);font-size:12px}
nav{display:flex;align-items:center;gap:28px;font-size:14px}nav a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--ink)}
.help{background:none;border:0;padding:8px 0;color:var(--muted)}.help:hover{text-decoration:underline;text-underline-offset:5px}
main{padding-block:36px 40px}
h1{font:600 clamp(34px,3.7vw,56px)/1.22 var(--serif);letter-spacing:.035em;margin:0 0 8px}
.lede{color:var(--muted);margin:0;font-size:15px}
.desk{display:grid;grid-template-columns:minmax(0,1fr) minmax(288px,352px);gap:clamp(28px,3.7vw,64px);margin-top:28px;align-items:start}
figure{margin:0;min-width:0}
.board{position:relative;isolation:isolate;display:grid;place-items:center;padding:clamp(24px,3.7vw,56px);background-color:#e4e4d9;background-image:radial-gradient(#c5c6b9 .7px,transparent .8px);background-size:7px 7px;border:1px solid #d9dacd}
.print{position:relative;width:100%;aspect-ratio:3/2;box-shadow:0 2px 3px #343b2423,1px 9px 18px -10px #272d2680}
.print canvas{display:block;width:100%;height:auto;background:#f6eedc}
#old-print{pointer-events:none;position:absolute;inset:0}#old-print[hidden]{display:none}
figcaption{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule);font-size:12px;color:var(--muted)}
figcaption strong{color:var(--ink);font:600 16px var(--serif)}
#place{margin-left:8px;font:italic 14px var(--latin)}.dimensions,output{font:13px/1.4 var(--mono);font-variant-numeric:tabular-nums}
.controls{border-top:2px solid var(--ink);min-width:0}
fieldset{border:0;padding:0;margin:0;min-inline-size:0}
.group{padding:16px 0 20px;border-bottom:1px solid var(--rule)}
legend,.slider-label{font-weight:600;font-size:15px;padding:0;margin:0 0 9px}
.subjects{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.choice{position:relative;display:block;cursor:pointer}
.choice input{position:absolute;width:1px;height:1px;clip-path:inset(50%);overflow:hidden}
.choice input:focus-visible + span{outline:3px solid #12616c;outline-offset:3px}
.subject{display:block;border:1px solid var(--rule);padding:4px 4px 1px;background:var(--paper);border-radius:3px}
.subject canvas{display:block;width:100%;aspect-ratio:3/2;background:#e9e5d9}
.sub-name{display:flex;align-items:center;justify-content:space-between;font-size:13px;padding:2px 3px}
.choice input:checked + .subject{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.choice input:checked + .subject .sub-name::after,.choice input:checked + .pair::after{content:"✓";font:600 13px var(--sans);color:var(--ink)}
.palettes{display:grid;grid-template-columns:1fr;gap:4px}
.pair{display:flex;align-items:center;gap:12px;min-height:36px;padding:3px 10px;border:1px solid transparent;border-radius:3px;font-size:14px}
.pair::after{margin-left:auto}.choice input:checked + .pair{border-color:#b9bbae;background:#eeeee6}
.swatch{position:relative;width:39px;height:22px;flex:none}
.swatch::before,.swatch::after{content:"";position:absolute;top:1px;width:21px;height:21px;border-radius:50%;background:var(--warm);mix-blend-mode:multiply}
.swatch::after{left:16px;background:var(--cool)}
.slider-row{display:flex;justify-content:space-between;align-items:baseline}.slider-label{margin-bottom:3px}
.range{display:block;width:100%;height:28px;margin:0;accent-color:var(--ink);cursor:pointer}
.save{width:100%;background:var(--ink);color:#fff;border:1px solid var(--ink);border-radius:3px;font-weight:600;padding:11px 18px;margin-top:20px;min-height:48px;display:flex;justify-content:space-between;align-items:center}
.save:hover{background:#3b4037}.save[aria-disabled="true"]{opacity:.65;cursor:wait}.save .arrow{font:22px/1 var(--sans)}
.message{min-height:1.6em;font-size:13px;margin:6px 0;color:var(--muted)}
dialog{width:min(440px,calc(100% - 32px));border:1px solid var(--ink);border-radius:4px;padding:28px;background:var(--paper);color:var(--ink)}
dialog::backdrop{background:#191d1670}dialog h2{font:600 26px var(--serif);margin:0 0 14px}dialog ol{padding-left:24px}dialog li{margin:8px 0}dialog p{font-size:14px;color:var(--muted)}dialog .close{padding:7px 18px;border:1px solid var(--ink);background:transparent;border-radius:3px}
@media(min-width:1500px){.desk{grid-template-columns:minmax(0,1fr) 370px}}
@media(max-width:950px){.shell{width:calc(100% - 48px)}.desk{grid-template-columns:minmax(0,1fr) 260px;gap:24px}.board{padding:24px}.brand-ja{display:none}}
@media(max-width:720px){.shell{width:calc(100% - 32px)}.mast{height:56px}.wordmark{font-size:29px}nav{gap:16px}.desk{grid-template-columns:1fr;gap:18px;margin-top:20px}main{padding:24px 0}.board{padding:clamp(16px,5vw,32px)}.lede{font-size:14px}.controls{border-top:0}.group{padding:10px 0 16px}.palettes{grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}.pair{min-height:50px;flex-wrap:wrap;justify-content:center;gap:4px;padding:4px;font-size:12px;text-align:center;border-color:var(--rule)}.pair::after{margin-left:0}.choice input:checked + .pair{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}.swatch{width:32px;height:19px}.swatch::before,.swatch::after{width:17px;height:17px}.swatch::after{left:12px}.dimensions{font-size:11px}}
@media(max-width:370px){.shell{width:calc(100% - 24px)}.pair{display:grid}.choice input:checked + .pair::after{position:absolute;right:4px;top:2px}#place{font-size:12px}}
@media(max-width:720px){
  .desk{gap:12px}.group{padding-block:8px 12px}.save{margin-top:12px}
  .subject{display:flex;align-items:center;gap:4px;padding:4px;min-height:48px}
  .subject canvas{width:42%;height:auto}.sub-name{flex:1;padding:0;font-size:12px}
}
@media(prefers-reduced-motion:reduce){#old-print{display:none!important}}

<header><div class="shell mast">
  <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span class="wordmark" lang="en">Kasane</span><span class="brand-ja">かさね印刷室</span></div>
  <nav aria-label="工房"><a href="#studio" aria-current="page">試し刷り</a><button id="help" class="help" type="button" aria-haspopup="dialog">使い方</button></nav>
</div></header>
<main class="shell" id="studio">
  <h1>二色刷りの見本帳</h1>
  <p class="lede">図案に二色のインクを重ねて、好きな一枚を刷ってみよう。</p>
  <div class="desk">
    <figure>
      <div class="board"><div class="print">
        <canvas id="art" width="1440" height="960" role="img" aria-label="夕凪の試し刷り"></canvas>
        <canvas id="old-print" width="1440" height="960" aria-hidden="true" hidden></canvas>
      </div></div>
      <figcaption><span><strong id="title">夕凪</strong><span id="place" lang="en">Seto Inland Sea</span></span><span class="dimensions">1440 × 960 px</span></figcaption>
    </figure>
    <div class="controls" aria-label="印刷設定">
      <div class="group"><fieldset><legend>図案</legend><div class="subjects">
        <label class="choice"><input type="radio" name="subject" value="sea" checked><span class="subject"><canvas width="216" height="144" data-thumb="sea" aria-hidden="true"></canvas><span class="sub-name">夕凪</span></span></label>
        <label class="choice"><input type="radio" name="subject" value="ridge"><span class="subject"><canvas width="216" height="144" data-thumb="ridge" aria-hidden="true"></canvas><span class="sub-name">山稜</span></span></label>
        <label class="choice"><input type="radio" name="subject" value="ripple"><span class="subject"><canvas width="216" height="144" data-thumb="ripple" aria-hidden="true"></canvas><span class="sub-name">波紋</span></span></label>
      </div></fieldset></div>
      <div class="group"><fieldset><legend>インクの組み合わせ</legend><div class="palettes">
        <label class="choice" style="--warm:#ef633c;--cool:#263f68"><input type="radio" name="palette" value="vermilion" checked><span class="pair"><i class="swatch" aria-hidden="true"></i>朱と群青</span></label>
        <label class="choice" style="--warm:#e5b640;--cool:#354944"><input type="radio" name="palette" value="ochre"><span class="pair"><i class="swatch" aria-hidden="true"></i>黄と深緑</span></label>
        <label class="choice" style="--warm:#ec8da1;--cool:#27626a"><input type="radio" name="palette" value="rose"><span class="pair"><i class="swatch" aria-hidden="true"></i>桜と青緑</span></label>
      </div></fieldset></div>
      <div class="group"><div class="slider-row"><label class="slider-label" for="offset">版ずれ</label><output for="offset" id="amount">4 px</output></div>
        <input class="range" id="offset" type="range" min="0" max="12" value="4" step="1" aria-valuetext="4ピクセル">
      </div>
      <button type="button" class="save" id="save">PNGを保存<span class="arrow" aria-hidden="true">↓</span></button>
      <p id="status" class="message" role="status"></p>
    </div>
  </div>
  <noscript>図案の表示と保存にはJavaScriptを有効にしてください。</noscript>
</main>
<dialog id="guide" aria-labelledby="guide-title"><h2 id="guide-title">試し刷りの手順</h2><ol><li>図案とインクの組み合わせを選びます。</li><li>版ずれを動かすと、二色目が右にずれます。矢印キーでも1 pxずつ調整できます。</li><li>「PNGを保存」で、表示中の一枚を書き出します。</li></ol><p>画面上で二色の重なりを模した見本です。実際の紙やインクによって仕上がりは変わります。</p><form method="dialog"><button class="close" autofocus>閉じる</button></form></dialog>
<script>
'use strict';
const designs = {
  sea: {name:'夕凪', place:'Seto Inland Sea', label:'瀬戸内海', subject:'水平線に夕日と島影'},
  ridge: {name:'山稜', place:'Shinano Highlands', label:'信濃高原', subject:'重なり合う尾根と朝日'},
  ripple: {name:'波紋', place:'Lakeside Echoes', label:'湖のほとり', subject:'水面に広がる同心円と葦'}
};
const palettes = {
  vermilion: ['朱と群青','#ef633c','#263f68'],
  ochre: ['黄と深緑','#e5b640','#354944'],
  rose: ['桜と青緑','#ec8da1','#27626a']
};
const paper = '#f6eedc';
const width = 900, height = 600;
function random(seed) {
  let value = seed;
  return () => { value = (Math.imul(value,1664525)+1013904223) >>> 0; return value / 4294967296; };
}
function sheet(w,h) { const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function path(g,shape) { g.fill(new Path2D(shape)); }
function circle(g,x,y,r) {g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();}
function line(g,x1,y1,x2,y2) {g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();}
function stripes(g,shape,ink,spacing,slant=0,weight=1.4) {
  g.save();g.clip(new Path2D(shape));g.strokeStyle=ink;g.lineWidth=weight;
  for(let y=-180;y<760;y+=spacing) line(g,0,y,920,y+slant);
  g.restore();
}
function dots(g,shape,ink,gap,radius) {
  g.save();g.clip(new Path2D(shape));g.fillStyle=ink;g.beginPath();
  for(let y=40,row=0;y<540;y+=gap,row++) for(let x=20+(row%2)*gap/2;x<900;x+=gap) {
    g.moveTo(x+radius,y);g.arc(x,y,radius,0,Math.PI*2);
  }
  g.fill();g.restore();
}
function makeGrain() {
  const tile=sheet(160,160),g=tile.getContext('2d'),image=g.createImageData(160,160),rnd=random(203);
  for(let i=0;i<image.data.length;i+=4) {
    const light=rnd()>.45;const v=light?255:57;
    image.data[i]=v;image.data[i+1]=light?250:49;image.data[i+2]=light?230:36;
    image.data[i+3]=Math.floor(rnd()*(light?44:18));
  }
  g.putImageData(image,0,0);return tile;
}
const grain=makeGrain();
function sea(g,warm,cool) {
  g.fillStyle=warm;circle(g,600,204,114);
  const distant='M30 362 Q124 324 164 330 T284 305 Q320 292 381 318 T498 328 Q568 289 612 283 Q648 270 702 292 T820 305 L880 299 V387 H30Z';
  dots(g,distant,cool,4,1.1);
  const island='M-10 344 Q46 296 81 294 Q108 292 131 276 Q150 270 176 279 Q196 280 214 288 Q242 298 268 294 Q294 294 320 312 Q344 321 367 318 Q394 315 417 330 Q451 345 491 347 L512 355 Q440 368 374 365 Q324 362 261 367 Q172 375 104 365 Q60 359 -10 375Z';
  g.fillStyle=cool;path(g,island);
  const farRight='M421 380 Q481 366 531 361 Q561 355 588 339 Q613 314 642 315 Q660 313 683 304 Q713 288 742 297 Q768 306 789 307 Q814 306 831 293 Q864 274 909 269 V369 Q847 365 788 375 Q722 382 648 378 Q552 379 501 389Z';
  stripes(g,farRight,cool,3.5,-16,2.3);
  g.strokeStyle=cool;const rnd=random(45);
  for(let i=0;i<315;i++){
    const y=367+rnd()*178,x=rnd()*920,len=7+rnd()*37+(y-367)*.12;
    if(y<393 && x<365)continue;
    g.globalAlpha=.28+rnd()*.58;g.lineWidth=.6+rnd()*.85;line(g,x,y,x+len,y+(rnd()-.5)*1.2);
  }
  g.globalAlpha=1;g.strokeStyle=warm;
  for(let i=0;i<66;i++){const y=377+i*2.2,spread=44+(y-377)*.53;const x=600+(rnd()-.5)*spread*1.8;g.lineWidth=1+rnd()*1.4;line(g,x,y,x+8+rnd()*24,y);}
  g.fillStyle=cool;
  path(g,'M-15 435 Q44 432 90 444 Q130 455 175 451 Q211 448 246 467 Q285 489 327 484 Q368 483 407 501 Q440 517 484 514 Q521 511 550 529 L597 557 H-15Z');
  // Fine cuts in the foreground headland reveal paper and the seaward slope.
  g.save();g.clip(new Path2D('M0 437 Q110 436 171 454 Q240 457 284 482 Q352 480 408 506 Q471 515 572 548 L600 560 H0Z'));
  g.strokeStyle=paper;g.lineWidth=1;
  for(let i=0;i<92;i++){const x=rnd()*570,y=437+rnd()*120;line(g,x,y,x+8+rnd()*22,y-2-rnd()*3);}
  g.restore();
  for(const [x,y,s] of [[515,412,1],[758,393,.68]]){
    g.save();g.translate(x,y);g.scale(s,s);g.fillStyle=cool;
    path(g,'M-14 0 L16 -1 L10 4 H-9Z M0 -2 V-28 L-8 -4Z');g.restore();
  }
}
function ridge(g,warm,cool) {
  g.fillStyle=warm;circle(g,653,165,91);
  const far='M0 344 L100 273 L154 293 L272 176 L333 208 L412 142 L499 229 L553 194 L632 270 L725 213 L902 308 V550 H0Z';
  dots(g,far,cool,4,1.15);
  g.fillStyle=warm;path(g,'M0 405 L142 292 L230 332 L388 201 L448 259 L513 224 L628 342 L731 299 L900 373 V560 H0Z');
  stripes(g,'M68 455 L389 203 L304 358 L249 398 L201 425Z M350 444 L511 226 L489 326 L423 408Z',cool,3.3,-85,1.4);
  g.fillStyle=cool;path(g,'M0 382 Q72 352 131 384 T263 375 Q326 342 380 358 Q425 371 478 355 Q542 327 591 358 T700 391 Q756 399 806 373 T908 370 V560 H0Z');
  const rnd=random(87);g.strokeStyle=paper;
  for(let i=0;i<200;i++){const x=rnd()*900,y=407+rnd()*144;g.globalAlpha=.58;g.lineWidth=.8;line(g,x,y,x+10+rnd()*20,y-4-rnd()*7);}g.globalAlpha=1;
  for(let i=0;i<98;i++){const x=i*9.5,y=471-21*Math.sin(x/85),h=12+rnd()*36;g.fillStyle=cool;path(g,'M'+(x-h*.22)+' '+y+' L'+x+' '+(y-h)+' L'+(x+h*.22)+' '+y+'Z');}
}
function ripple(g,warm,cool) {
  g.fillStyle=warm;circle(g,637,283,134);
  g.lineWidth=2;g.strokeStyle=cool;
  for(const [cx,cy,n] of [[308,358,31],[686,434,22],[828,213,11]]){
    for(let i=1;i<=n;i++){g.beginPath();g.ellipse(cx,cy,9*i,3.6*i,-.095,0,Math.PI*2);g.stroke();}
  }
  const rnd=random(252);g.strokeStyle=cool;g.fillStyle=cool;
  for(let i=0;i<32;i++){
    const x=10+rnd()*175,y=552,h=50+rnd()*178,dx=22+rnd()*49;
    g.lineWidth=1.7;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+4,y-h*.7,x+dx,y-h);g.stroke();
    g.save();g.translate(x+dx,y-h);g.rotate(.48);g.beginPath();g.ellipse(0,0,2.4,13,0,0,Math.PI*2);g.fill();g.restore();
  }
}
const painters={sea,ridge,ripple};
function registration(g,x,y,ink) {
  g.strokeStyle=ink;g.lineWidth=.9;line(g,x-6,y,x+6,y);line(g,x,y-6,x,y+6);
}
let lastPlates=null;
function makePlates(target,subject,palette,thumbnail) {
  const key=subject+'/'+palette+'/'+target.width;
  if(!thumbnail && lastPlates?.key===key)return lastPlates.plates;
  const [,warm,cool]=palettes[palette],ratio=target.width/width;
  // Each ink has its own transparent plate. Moving the second plate changes its registration.
  const plates=[warm,cool].map(ink=>{
    const layer=sheet(target.width,target.height),c=layer.getContext('2d');
    c.scale(ratio,ratio);c.beginPath();c.rect(30,30,840,496);c.clip();
    painters[subject](c,ink===warm?warm:'rgba(0,0,0,0)',ink===cool?cool:'rgba(0,0,0,0)');
    return layer;
  });
  if(!thumbnail)lastPlates={key,plates};
  return plates;
}
function render(target,subject,palette,offset,thumbnail=false) {
  const g=target.getContext('2d'),ratio=target.width/width,[,warm,cool]=palettes[palette];
  const info=designs[subject],plates=makePlates(target,subject,palette,thumbnail);
  g.save();g.scale(ratio,ratio);g.fillStyle=paper;g.fillRect(0,0,width,height);
  g.globalCompositeOperation='multiply';
  g.drawImage(plates[0],0,0,width,height);g.drawImage(plates[1],offset/(1440/width),0,width,height);
  g.globalCompositeOperation='source-over';
  if(!thumbnail){
    g.fillStyle=cool;g.font='600 77px "Yu Mincho","Hiragino Mincho ProN",serif';g.fillText(info.name,48,125);
    g.font='italic 26px Georgia,serif';g.fillText(info.place,52,166);
    g.strokeStyle=cool;g.lineWidth=.8;line(g,31,547,869,547);
    g.fillStyle=cool;g.font='17px "Yu Mincho",serif';g.fillText(info.label,34,577);
    g.textAlign='center';g.font='italic 17px Georgia,serif';g.fillText('Kasane Print Studio',450,577);g.textAlign='left';
    g.fillStyle=warm;circle(g,831,570,8);g.globalCompositeOperation='multiply';g.fillStyle=cool;circle(g,840,570,8);g.globalCompositeOperation='source-over';
    registration(g,17,18,cool);registration(g,883,18,cool);registration(g,17,582,cool);registration(g,883,582,cool);
  }else{
    g.fillStyle=cool;g.font='600 62px "Yu Mincho",serif';g.fillText(info.name,45,124);
  }
  g.fillStyle=g.createPattern(grain,'repeat');g.fillRect(0,0,width,height);g.restore();
}
const art=document.getElementById('art'), oldPrint=document.getElementById('old-print');
const motion=matchMedia('(prefers-reduced-motion: reduce)');
const state={subject:'sea',palette:'vermilion',offset:4};
let wipe=null,frame=0;
function stopWipe(){
  if(wipe){wipe.onfinish=null;wipe.cancel();wipe=null;}
  oldPrint.hidden=true;
}
function update(wipeRequested=false) {
  stopWipe();
  const animate=wipeRequested && !motion.matches && typeof oldPrint.animate==='function';
  if(animate)oldPrint.getContext('2d').drawImage(art,0,0);
  render(art,state.subject,state.palette,state.offset);
  const info=designs[state.subject];document.getElementById('title').textContent=info.name;
  document.getElementById('place').textContent=info.place;
  art.setAttribute('aria-label',info.name+'。'+info.subject+'。'+palettes[state.palette][0]+'、版ずれ'+state.offset+'ピクセル');
  if(animate){
    oldPrint.hidden=false;
    wipe=oldPrint.animate([{clipPath:'inset(0 0 0 0)'},{clipPath:'inset(0 0 0 100%)'}],{duration:220,easing:'ease-out',fill:'forwards'});
    wipe.onfinish=stopWipe;
  }
}
function thumbs(){for(const canvas of document.querySelectorAll('[data-thumb]'))render(canvas,canvas.dataset.thumb,state.palette,0,true);}
function flush(){if(frame){cancelAnimationFrame(frame);frame=0;}update();}
const offset=document.getElementById('offset'), amount=document.getElementById('amount'), status=document.getElementById('status');
for(const input of document.querySelectorAll('input[type=radio]'))input.addEventListener('change',()=>{
  if(frame){cancelAnimationFrame(frame);frame=0;}
  state[input.name]=input.value;status.textContent='';if(input.name==='palette')thumbs();update(input.name==='subject');
});
offset.addEventListener('input',()=>{
  state.offset=Number(offset.value);amount.value=state.offset+' px';offset.setAttribute('aria-valuetext',state.offset+'ピクセル');status.textContent='';
  if(!frame)frame=requestAnimationFrame(()=>{frame=0;update();});
});
motion.addEventListener('change',stopWipe);
const help=document.getElementById('help'),guide=document.getElementById('guide');
help.addEventListener('click',()=>guide.showModal());
const save=document.getElementById('save');
save.addEventListener('click',()=>{
  if(save.getAttribute('aria-disabled')==='true')return;
  if(frame)flush();
  const name=['kasane',state.subject,state.palette,state.offset+'px'].join('-')+'.png';
  save.setAttribute('aria-disabled','true');
  art.toBlob(blob=>{
    save.removeAttribute('aria-disabled');
    if(!blob){status.textContent='PNGを作れませんでした。もう一度お試しください。';return;}
    const link=document.createElement('a'),url=URL.createObjectURL(blob);
    link.href=url;link.download=name;document.body.append(link);link.click();link.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);
    status.textContent='PNGを書き出しました。';
  },'image/png');
});
thumbs();update();
</script>
</html>
