<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>入力修正とUndoの動作例</title>
<style>body{font-family:system-ui,sans-serif;max-width:56rem;margin:2rem auto;padding:0 1rem;line-height:1.7;color:#17212b}section{border:1px solid #bac3ca;padding:1.2rem;margin:1.5rem 0}label{display:block;margin:.6rem 0}input,select,button{font:inherit;padding:.4rem}input{max-width:100%;box-sizing:border-box}button{margin:.4rem .4rem .4rem 0}li{margin:.2rem 0}[hidden]{display:none}.note{color:#43515c}.error{color:#a11224}pre{white-space:pre-wrap}</style>
<main><h1>入力修正とUndoの動作例</h1><p>すべてこのページ内の模擬データです。実際の申請や外部サービスには接続しません。</p>
<section><h2>申請内容を確認して送る</h2><p>一項目を修正した後も、ほかの入力は保持します。</p>
<label>模擬サービスの結果 <select id="app-mode"><option value="invalid">メールだけを拒否</option><option value="normal">正常完了</option><option value="lost">完了後に応答を喪失</option><option value="failed">サービスが送信を拒否</option></select></label>
<form id="application-form"><label>氏名 <input id="name" value="Aki"></label><label>メール <input id="email" value="old@example.test"></label>
<label>受取方法 <select id="delivery"><option value="shipping">配送</option><option value="pickup">店頭受取</option></select></label>
<label id="address-row">配送先 <input id="address" value="1 Example Street"></label>
<ul id="errors" class="error"></ul><p id="app-message" role="status"></p>
<button type="button" id="review">内容を確認する</button><button type="button" id="app-check" hidden>提出結果を確認する</button>
<div id="review-panel" hidden><h3>今回提出する内容</h3><pre id="answers"></pre><button type="button" id="change-email">メールを変更する</button><button type="button" id="submit">この内容で申請を送る</button></div></form>
<p id="app-result"></p></section>
<section><h2>アーカイブ状態を戻す</h2><p>要求の受付と、実際に戻ったことを分けて表示します。</p>
<label>模擬例 <select id="undo-mode"><option value="local">このページ内で復元</option><option value="async-success">外部補償：受付後に成功</option><option value="async-failed">外部補償：受付後に失敗</option><option value="expired">Undoの期限が経過</option><option value="conflict">他の操作で更新済み</option></select></label>
<p id="undo-message" role="status"></p><p id="undo-scope"></p><p id="undo-residual"></p>
<button type="button" id="undo">アーカイブ状態を戻す</button><button type="button" id="undo-check" hidden>回復結果を確認する</button>
<p id="undo-next"></p><p id="fixture-state" class="note"></p></section>
<p class="note">実ブラウザでの表示・キーボード・読み上げと利用者の理解度は、別の検証が必要です。</p></main>
<script type="module">
import {createApplication,createReversal} from './task-flows.mjs';
const $=id=>document.getElementById(id);let seq=0;const nextId=()=>`demo-${++seq}`;
const saved=new Map();const appCalls=[];
const application=createApplication({submit:async request=>{appCalls.push(request);const mode=$('app-mode').value;if(mode==='invalid')return {status:'invalid',fieldErrors:{email:'受信できるメールアドレスに修正してください。'}};if(mode==='failed')return {status:'failed',message:'模擬サービスは送信を受け付けませんでした。結果設定を正常完了へ切り替え、入力を確認して送信し直せます。'};saved.set(request.requestId,{status:'succeeded',reference:request.requestId});if(mode==='lost')throw Error('reply lost');return saved.get(request.requestId);},lookup:async id=>saved.get(id)||{status:'not_found'}},{initial:{name:'Aki',email:'old@example.test',delivery:'shipping',address:'1 Example Street'},nextId});
let reversal,item,restoreCalls=[];
function resetReversal(){const mode=$('undo-mode').value;item={id:'archive-1',revision:mode==='conflict'?2:1,archived:true};restoreCalls=[];
 reversal=createReversal({restore:async request=>{restoreCalls.push(request);if(request.expectedRevision!==item.revision)return {status:'conflict'};if(mode.startsWith('async'))return {status:'pending'};item.archived=false;return {status:'restored'};},lookup:async()=>{if(mode==='async-failed')return {status:'failed',message:'補償処理が失敗しました。アーカイブ状態の回復は確認できていません。'};item.archived=false;return {status:'restored'};}},{kind:mode.startsWith('async')?'compensation':'local',itemId:'archive-1',expectedRevision:1,validUntil:mode==='expired'?Date.now()-1:null,nextId,scope:'この書類のアーカイブ状態',residualEffects:mode.startsWith('async')?['送信済みの通知は取り消されません。']:[],recoveryAction:'模擬データの状態と操作番号を確認してください。'});}
function render(){const a=application.view();for(const field of ['name','email','delivery','address']){$(field).value=a.draft[field];$(field).disabled=['pending','unknown','submitted'].includes(a.phase);}
 $('address-row').hidden=a.draft.delivery!=='shipping';$('review-panel').hidden=a.phase!=='review';$('answers').textContent=JSON.stringify(a.effective,null,2);$('review').hidden=['pending','unknown','submitted','review'].includes(a.phase);$('app-check').hidden=!a.canCheck;$('submit').disabled=!a.canSubmit;
 $('app-message').textContent=a.formError||({review:'内容を確認し、必要なら変更してください。',submitted:'提出完了を確認しました。',pending:'処理結果を待っています。',editing:'必要な項目を入力・修正できます。'})[a.phase];$('errors').replaceChildren();for(const [field,message] of Object.entries(a.errors)){const li=document.createElement('li'),link=document.createElement('a');link.href=`#${field}`;link.textContent=`${field}: ${message}`;li.append(link);$('errors').append(li);}
 $('app-result').textContent=a.phase==='submitted'?`確認できた申請番号：${a.reference}`:a.operationId?`操作番号：${a.operationId}。下書き保持は提出完了の証拠ではありません。`:'';
 const u=reversal.view();$('undo-message').textContent=u.message||'この例の元に戻す操作を開始できます。';$('undo-scope').textContent=`回復する範囲：${u.scope}`;$('undo-residual').textContent=u.residualEffects.join(' ');$('undo').disabled=!u.canUndo;$('undo-check').hidden=!u.canCheck;$('undo-next').textContent=['failed','conflict','expired','unknown'].includes(u.phase)?`${u.nextAction||''} ${u.operationId||''}`:'';$('fixture-state').textContent=`模擬データの実状態：${item.archived?'アーカイブ中':'アーカイブ解除済み'}、版 ${item.revision}`;
}
for(const field of ['name','email','delivery','address'])$(field).addEventListener('change',()=>{application.set(field,$(field).value);render();});
$('review').onclick=()=>{application.review();render();};$('change-email').onclick=()=>{application.change('email');render();$('email').focus();};
async function act(fn){const p=fn();render();await p;render();}
$('submit').onclick=()=>act(()=>application.submit());$('app-check').onclick=()=>act(()=>application.check());$('undo').onclick=()=>act(()=>reversal.undo());$('undo-check').onclick=()=>act(()=>reversal.check());$('undo-mode').onchange=()=>{resetReversal();render();};
resetReversal();render();window.taskDemo={application,getReversal:()=>reversal,getItem:()=>({...item}),appCalls,getRestoreCalls:()=>restoreCalls};
</script></html>
